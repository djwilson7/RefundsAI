services:
  - type: web
    name: refundsai
    runtime: static
    branch: main
    buildCommand: npm ci --workspace @refunds-ai/web && npm run web:build:static
    staticPublishPath: ./apps/web/static-site/out
    autoDeployTrigger: commit
    domains:
      - refundsai.dontaiwilson.com
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_VERSION
        value: "24.13.1"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; frame-src 'none'; form-action 'self'; object-src 'none'; base-uri 'self'"
    routes:
      - type: redirect
        source: /*
        destination: /
